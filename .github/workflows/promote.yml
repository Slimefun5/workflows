name: Promote experimental to stable

# Updates the stable branch ONLY through this workflow (never by a direct push).
# Trigger by pushing a tag like `promote-2026-06-15`, or run it manually once it
# exists on the default branch. It fast-forwards stable to experimental when possible,
# otherwise records a merge commit. No README regeneration (this repo is not an addon).

on:
  push:
    tags:
      - "promote-*"
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout stable
        uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0

      - name: Merge experimental into stable
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin experimental
          git merge --ff-only origin/experimental || git merge --no-edit origin/experimental
          git push origin stable
