name: Generate README

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository name (e.g., Slimefun5/DynaTech)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      repository:
        description: 'Repository name (e.g., Slimefun5/DynaTech)'
        required: true
        type: string

jobs:
  generate-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout stable branch
        uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0

      - name: Generate README.md
        run: |
          repo_name=$(echo "${{ inputs.repository }}" | cut -d'/' -f2)
          org_name=$(echo "${{ inputs.repository }}" | cut -d'/' -f1)
          
          description=""
          if [ -f "gradle.properties" ]; then
            description=$(grep "^description=" gradle.properties | cut -d'=' -f2- | tr -d '\r')
          fi
          if [ -z "$description" ]; then
            description="A Slimefun 5 Addon."
          fi
          
          latest_tag=$(curl -s https://api.github.com/repos/${{ inputs.repository }}/tags | jq -r 'if type == "array" and length > 0 then .[0].name else "v1.0.0" end')
          
          old_readme_commit=$(git log --grep="docs: remove static README" --format="%H" | head -n 1)
          if [ -n "$old_readme_commit" ]; then
            git show ${old_readme_commit}^:README.md > old_content.md 2>/dev/null || touch old_content.md
          else
            old_readme_commit=$(git log --grep="port to Slimefun5" --format="%H" | head -n 1)
            if [ -n "$old_readme_commit" ]; then
              git show ${old_readme_commit}^:README.md > old_content.md 2>/dev/null || touch old_content.md
            else
              touch old_content.md
            fi
          fi
          
          sed -i '/img.shields.io/d' old_content.md
          sed -i '/badge.svg/d' old_content.md
          sed -i '/# '"$repo_name"'/d' old_content.md
          sed -i '/^## Requirements/,/^## /{ /^## Requirements/d; /^## [^R]/!d; }' old_content.md
          sed -i '/^## Developer API/,/^```$/d' old_content.md
          sed -i '/^- Java/d' old_content.md
          sed -i '/^- Paper/d' old_content.md
          sed -i '/^- Slimefun/d' old_content.md
          sed -i '/github-gradle/d' old_content.md
          sed -i '/githubCompileOnly/d' old_content.md
          sed -i '/^```kotlin/,/^```$/d' old_content.md
          sed -i '/^[[:space:]]*$/N;/^\n$/d' old_content.md
          
          cat <<EOF > README.md
          # $repo_name
          
          [![Build Status](https://Slimefun5.github.io/builds/$org_name/$repo_name/stable/badge.svg)](https://Slimefun5.github.io/builds/$org_name/$repo_name/stable)
          ![GitHub Downloads (all assets, all releases)](https://img.shields.io/github/downloads/$org_name/$repo_name/total)
          [![GitHub Followers](https://img.shields.io/github/followers/$org_name?style=social)](https://github.com/$org_name)
          [![GitHub Stars](https://img.shields.io/github/stars/$org_name/$repo_name?style=social)](https://github.com/$org_name/$repo_name)
          
          $description
          
          ## Requirements
          - Java 25
          - Paper 1.16.* - 26.1.*
          - Slimefun 5
          
          ## Developer API
          
          You can easily depend on this project using [github-gradle](https://github.com/intisy/github-gradle).
          
          In your \`build.gradle.kts\`:
          
          \`\`\`kotlin
          plugins {
              id("io.github.intisy.github-gradle") version "1.8.2.1"
          }
          
          dependencies {
              "githubCompileOnly"("$org_name:$repo_name:$latest_tag")
          }
          \`\`\`
          
          EOF
          
          cat old_content.md >> README.md
          rm old_content.md

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: 'docs: auto-generate README.md [skip ci]'
          add: 'README.md'
          default_author: github_actions
