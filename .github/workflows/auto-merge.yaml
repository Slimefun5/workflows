name: Auto Merge Experimental to Stable

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository name (e.g., Slimefun5/DynaTech)'
        required: true
        type: string

jobs:
  merge-and-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout stable
        uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0

      - name: Save stable README
        run: |
          if [ -f "README.md" ]; then
            cp README.md README.md.stable-backup
          fi

      - name: Merge experimental into stable
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin experimental
          git merge origin/experimental --allow-unrelated-histories -m "chore: auto-merge experimental to stable"

      - name: Restore stable README
        run: |
          if [ -f "README.md.stable-backup" ]; then
            cp README.md.stable-backup README.md
            rm README.md.stable-backup
          fi

      - name: Generate README
        run: |
          repo_name=$(echo "${{ inputs.repository }}" | cut -d'/' -f2)
          org_name=$(echo "${{ inputs.repository }}" | cut -d'/' -f1)

          if [ -f "gradle.properties" ]; then
            description=$(grep "^description=" gradle.properties | cut -d'=' -f2- | tr -d '\r')
          else
            description="A Slimefun 5 Addon."
          fi

          latest_tag=$(curl -s https://api.github.com/repos/${{ inputs.repository }}/tags | jq -r '.[0].name // "v1.0.0"')

          old_readme_commit=$(git log --format="%H" -- README.md | tail -n 1)
          if [ -n "$old_readme_commit" ]; then
            git show ${old_readme_commit}:README.md > old_content.md 2>/dev/null || touch old_content.md
          else
            touch old_content.md
          fi

          sed -i '/img.shields.io/d' old_content.md
          sed -i '/badge.svg/d' old_content.md
          sed -i '/# '"$repo_name"'/d' old_content.md
          sed -i '/^[[:space:]]*$/N;/^\n$/d' old_content.md

          cat > README.md <<EOF
          # $repo_name

          [![Build Status](https://Slimefun5.github.io/builds/$org_name/$repo_name/stable/badge.svg)](https://Slimefun5.github.io/builds/$org_name/$repo_name/stable)
          ![GitHub Downloads (all assets, all releases)](https://img.shields.io/github/downloads/$org_name/$repo_name/total)
          [![GitHub Followers](https://img.shields.io/github/followers/$org_name?style=social)](https://github.com/$org_name)
          [![GitHub Stars](https://img.shields.io/github/stars/$org_name/$repo_name?style=social)](https://github.com/$org_name/$repo_name)

          $description

          ## Requirements
          - Java 25
          - Paper 1.16.* - 26.1.*
          - Slimefun 5

          ## Developer API

          You can easily depend on this project using [github-gradle](https://github.com/intisy/github-gradle).

          In your \`build.gradle.kts\`:

          \`\`\`kotlin
          plugins {
              id("io.github.intisy.github-gradle") version "1.8.2.1"
          }

          dependencies {
              "githubCompileOnly"("$org_name:$repo_name:$latest_tag")
          }
          \`\`\`

          EOF

          cat old_content.md >> README.md
          rm -f old_content.md

      - name: Commit and push
        run: |
          git add README.md
          git rm -f README.md.stable-backup 2>/dev/null || true
          git commit -m "chore: auto-merge experimental to stable with readme generation [skip ci]" --allow-empty
          git push origin stable