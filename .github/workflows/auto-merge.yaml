name: Auto Merge Experimental to Stable

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository name (e.g., Slimefun5/DynaTech)'
        required: true
        type: string

jobs:
  merge-and-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout stable
        uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0

      - name: Save stable README
        run: |
          if [ -f "README.md" ]; then
            cp README.md README.md.stable-backup
          fi

      - name: Merge experimental into stable
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin experimental
          if ! git merge origin/experimental --allow-unrelated-histories -m "chore: auto-merge experimental to stable"; then
            git checkout --ours README.md 2>/dev/null || true
            git checkout --ours .github/workflows/ 2>/dev/null || true
            git add -A
            git commit --no-edit
          fi

      - name: Restore stable README
        run: |
          if [ -f "README.md.stable-backup" ]; then
            cp README.md.stable-backup README.md
            rm README.md.stable-backup
          fi

      - name: Fetch generator script
        run: curl -sL https://raw.githubusercontent.com/Slimefun5/workflows/stable/.github/scripts/generate-readme.py -o generate-readme.py

      - name: Generate README
        run: python3 generate-readme.py --repository "${{ inputs.repository }}"

      - name: Commit and push
        run: |
          git add README.md
          git rm -f README.md.stable-backup 2>/dev/null || true
          git commit -m "chore: auto-merge experimental to stable with readme generation [skip ci]" --allow-empty
          git push origin stable
