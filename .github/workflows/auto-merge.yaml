name: Auto Merge Experimental to Stable

# Brings experimental's content onto stable on a release tag, then regenerates the README.
# stable is a mirror of experimental + a generated README.md, so we take experimental's tree
# WHOLESALE (git read-tree --reset) rather than a 3-way merge — a 3-way merge conflicts on the
# generated README.md vs the source CONTENT.md (rename/content) and used to commit conflict markers.
# The merge parent is preserved via `merge -s ours`. experimental has no README.md; it is generated
# here after the merge (a GITHUB_TOKEN push does NOT re-trigger readme.yaml, so we generate it).

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository name (e.g., Slimefun5/DynaTech)'
        required: true
        type: string

jobs:
  merge-and-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout stable
        uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0

      - name: Merge experimental into stable (tree = experimental)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin experimental
          if git merge --ff-only origin/experimental; then
            echo "Fast-forwarded stable to experimental."
          else
            echo "Divergent: recording a merge whose tree equals experimental."
            git merge -s ours --no-commit --allow-unrelated-histories origin/experimental
            git read-tree --reset -u origin/experimental
            git commit --no-edit -m "chore: auto-merge experimental to stable"
          fi

      - name: Regenerate README on stable
        run: |
          curl -sL https://raw.githubusercontent.com/Slimefun5/workflows/stable/.github/scripts/generate-readme.py -o /tmp/generate-readme.py
          python3 /tmp/generate-readme.py --repository "${{ inputs.repository }}"
          if [ -n "$(git status --porcelain README.md)" ]; then
            git add README.md
            git commit -m "docs: auto-generate README.md [skip ci]"
          fi

      - name: Push stable
        run: git push origin stable
