name: Java CI

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # slimefun-addon.gradle is applied over HTTP, and Gradle caches that fetch for 24h under
      # modules-2/resources-2.1. setup-gradle restores the whole Gradle home, so a convention
      # change (a core version bump, say) would otherwise never reach the runner.
      - name: Drop cached remote build scripts
        run: rm -rf ~/.gradle/caches/modules-2/resources-2.1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon -x test
        env:
          # github-gradle shells out to gh to resolve cross-repo release assets.
          GITHUB_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
