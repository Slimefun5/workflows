name: Publish to platforms

# Each platform is skipped when its credentials are unset: secrets MODRINTH_TOKEN / HANGAR_TOKEN,
# variables MODRINTH_ID / HANGAR_ID. SpigotMC has no upload API and stays manual.

on:
  workflow_call:
    inputs:
      project_name:
        description: 'Display name used for the release/version title'
        required: true
        type: string
      java_version:
        description: 'Java version the build runs on'
        required: false
        type: string
        default: '21'
      gradle_task:
        description: 'Gradle task that produces the shaded jar'
        required: false
        type: string
        default: 'shadowJar'
      jar_dir:
        description: 'Directory containing the built jar (the shaded jar, minus -sources/-javadoc)'
        required: false
        type: string
        default: 'build/libs'
      modrinth_game_versions:
        description: 'Game versions tagged on Modrinth; it silently drops any it does not recognise'
        required: false
        type: string
        default: |
          1.8
          1.8.1
          1.8.2
          1.8.3
          1.8.4
          1.8.5
          1.8.6
          1.8.7
          1.8.8
          1.8.9
          1.9
          1.9.1
          1.9.2
          1.9.3
          1.9.4
          1.10
          1.10.1
          1.10.2
          1.11
          1.11.1
          1.11.2
          1.12
          1.12.1
          1.12.2
          1.13
          1.13.1
          1.13.2
          1.14
          1.14.1
          1.14.2
          1.14.3
          1.14.4
          1.15
          1.15.1
          1.15.2
          1.16
          1.16.1
          1.16.2
          1.16.3
          1.16.4
          1.16.5
          1.17
          1.17.1
          1.18
          1.18.1
          1.18.2
          1.19
          1.19.1
          1.19.2
          1.19.3
          1.19.4
          1.20
          1.20.1
          1.20.2
          1.20.3
          1.20.4
          1.20.5
          1.20.6
          1.21
          1.21.1
          1.21.2
          1.21.3
          1.21.4
          1.21.5
          1.21.6
          1.21.7
          1.21.8
          1.21.9
          1.21.10
          1.21.11
          26.1
          26.1.1
          26.1.2
          26.2
      modrinth_loaders:
        description: 'Loaders declared on the Modrinth version'
        required: false
        type: string
        default: |
          paper
          spigot
          bukkit
      hangar_channel:
        description: 'Hangar release channel'
        required: false
        type: string
        default: 'Release'
      hangar_platform_versions:
        description: 'JSON of Hangar platform to supported version ranges'
        required: false
        type: string
        default: '{"PAPER": [">=1.8"]}'
      github_release:
        description: 'Create the GitHub release here; false when the caller already owns the release'
        required: false
        type: boolean
        default: true
      tag:
        description: 'Release tag the version is taken from; empty takes the ref the run was started from'
        required: false
        type: string
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java_version }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve the release tag
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: echo "name=${TAG:-$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Resolve version (strip leading v)
        id: ver
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build jar (version from the release tag)
        run: ./gradlew ${{ inputs.gradle_task }} -Partifact_version=${{ steps.ver.outputs.version }} --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Stage a single clean jar
        id: stage
        run: |
          mkdir -p upload
          jar=$(ls "${{ inputs.jar_dir }}"/*.jar | grep -vE '(-sources|-javadoc)\.jar$' | head -1)
          if [ -z "$jar" ]; then echo "::error::No jar found in ${{ inputs.jar_dir }}"; exit 1; fi
          dest="upload/${{ inputs.project_name }}-${{ steps.ver.outputs.version }}.jar"
          cp "$jar" "$dest"
          echo "file=$dest" >> "$GITHUB_OUTPUT"
          echo "Staged $jar -> $dest"

      - name: Publish to Modrinth
        if: ${{ vars.MODRINTH_ID != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.stage.outputs.file }}
          name: ${{ inputs.project_name }} ${{ steps.ver.outputs.version }}
          version: ${{ steps.ver.outputs.version }}
          version-type: release
          game-versions: ${{ inputs.modrinth_game_versions }}
          loaders: ${{ inputs.modrinth_loaders }}

      - name: Create GitHub release with the jar
        if: ${{ inputs.github_release }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.stage.outputs.file }}
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ inputs.project_name }} ${{ steps.ver.outputs.version }}
          generate_release_notes: true

      # Hangar last: its version validation is the most finicky, so a Hangar failure must not block
      # Modrinth or the GitHub release above.
      - name: Publish to Hangar
        if: ${{ vars.HANGAR_ID != '' }}
        uses: milkdrinkers/Hangar-Publish@v2
        with:
          api_token: ${{ secrets.HANGAR_TOKEN }}
          slug: ${{ vars.HANGAR_ID }}
          version: ${{ steps.ver.outputs.version }}
          channel: ${{ inputs.hangar_channel }}
          files: |
            [
              { "path": "${{ steps.stage.outputs.file }}", "platforms": ["PAPER"] }
            ]
          platform_dependencies: ${{ inputs.hangar_platform_versions }}
