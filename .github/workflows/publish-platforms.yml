name: Publish to platforms

# Reusable publish workflow shared by every Slimefun plugin (core + addons).
# Builds the jar once, stages a single clean copy, then publishes to Modrinth + Hangar and
# (optionally) creates the GitHub release. Each platform is skipped if its credentials are unset:
#   Secrets:   MODRINTH_TOKEN, HANGAR_TOKEN   (PAT optional, for cross-repo dependency reads)
#   Variables: MODRINTH_ID (project slug), HANGAR_ID (project slug only)
# SpigotMC has no upload API and cannot be automated here - upload that jar manually.
#
# NOTE: mc-publish does NOT support Hangar; Hangar uses milkdrinkers/Hangar-Publish.

on:
  workflow_call:
    inputs:
      project_name:
        description: "Display name used for the release/version title"
        required: true
        type: string
      java_version:
        required: false
        default: "21"
        type: string
      gradle_task:
        description: "Gradle task that produces the shaded jar"
        required: false
        default: "shadowJar"
        type: string
      jar_dir:
        description: "Directory containing the built jar (the shaded jar, minus -sources/-javadoc)"
        required: false
        default: "build/libs"
        type: string
      modrinth_game_versions:
        required: false
        # The universal jar runs on 1.8 through the latest; list every release so Modrinth tags them
        # all (it silently drops any it doesn't recognise). Hangar uses the >=1.8 range instead.
        default: |
          1.8
          1.8.1
          1.8.2
          1.8.3
          1.8.4
          1.8.5
          1.8.6
          1.8.7
          1.8.8
          1.8.9
          1.9
          1.9.1
          1.9.2
          1.9.3
          1.9.4
          1.10
          1.10.1
          1.10.2
          1.11
          1.11.1
          1.11.2
          1.12
          1.12.1
          1.12.2
          1.13
          1.13.1
          1.13.2
          1.14
          1.14.1
          1.14.2
          1.14.3
          1.14.4
          1.15
          1.15.1
          1.15.2
          1.16
          1.16.1
          1.16.2
          1.16.3
          1.16.4
          1.16.5
          1.17
          1.17.1
          1.18
          1.18.1
          1.18.2
          1.19
          1.19.1
          1.19.2
          1.19.3
          1.19.4
          1.20
          1.20.1
          1.20.2
          1.20.3
          1.20.4
          1.20.5
          1.20.6
          1.21
          1.21.1
          1.21.2
          1.21.3
          1.21.4
          1.21.5
          1.21.6
          1.21.7
          1.21.8
          1.21.9
          1.21.10
          1.21.11
          26.1
          26.1.1
          26.1.2
          26.2
        type: string
      modrinth_loaders:
        required: false
        default: |
          paper
          spigot
          bukkit
        type: string
      hangar_channel:
        required: false
        default: "Release"
        type: string
      hangar_platform_versions:
        description: "JSON of Hangar platform -> supported version ranges"
        required: false
        default: '{"PAPER": [">=1.8"]}'
        type: string
      github_release:
        description: "Create the GitHub release here. Set false for dependency repos whose publish.yml already owns the release."
        required: false
        default: true
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ inputs.java_version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java_version }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build jar (version from the release tag)
        run: ./gradlew ${{ inputs.gradle_task }} -Partifact_version=${{ github.ref_name }} --no-daemon
        env:
          # PAT covers cross-repo dependency reads (github-gradle release assets); falls back to the default token.
          GITHUB_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Stage a single clean jar
        id: stage
        run: |
          mkdir -p upload
          jar=$(ls "${{ inputs.jar_dir }}"/*.jar | grep -vE '(-sources|-javadoc)\.jar$' | head -1)
          if [ -z "$jar" ]; then echo "::error::No jar found in ${{ inputs.jar_dir }}"; exit 1; fi
          dest="upload/${{ inputs.project_name }}-${{ github.ref_name }}.jar"
          cp "$jar" "$dest"
          echo "file=$dest" >> "$GITHUB_OUTPUT"
          echo "Staged $jar -> $dest"

      - name: Publish to Modrinth (skips if id/token unset)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.stage.outputs.file }}
          name: ${{ inputs.project_name }} ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          version-type: release
          game-versions: ${{ inputs.modrinth_game_versions }}
          loaders: ${{ inputs.modrinth_loaders }}

      - name: Create GitHub release with the jar
        if: ${{ inputs.github_release }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.stage.outputs.file }}
          tag_name: ${{ github.ref_name }}
          name: ${{ inputs.project_name }} ${{ github.ref_name }}
          generate_release_notes: true

      # Hangar last: its version validation is the most finicky, so a Hangar failure must not
      # block Modrinth or the GitHub release above.
      - name: Publish to Hangar (skips if slug unset)
        if: ${{ vars.HANGAR_ID != '' }}
        uses: milkdrinkers/Hangar-Publish@v2
        with:
          api_token: ${{ secrets.HANGAR_TOKEN }}
          slug: ${{ vars.HANGAR_ID }}
          version: ${{ github.ref_name }}
          channel: ${{ inputs.hangar_channel }}
          files: |
            [
              { "path": "${{ steps.stage.outputs.file }}", "platforms": ["PAPER"] }
            ]
          platform_dependencies: ${{ inputs.hangar_platform_versions }}
